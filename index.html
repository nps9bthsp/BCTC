<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đối chiếu Kế toán v3.1 | Phát triển bởi Nguyễn Phước Sang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-bg { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header Chính thức -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl shadow-md flex items-center justify-center">
                        <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <span class="font-extrabold text-xl tracking-tight text-slate-800 leading-tight">FinRecon System</span>
                        <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-[13px] tracking-wide uppercase mt-0.5">
                            Phát triển bởi Nguyễn Phước Sang
                        </span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-4">
                    <span class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">Phiên bản 3.1 (Enterprise)</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Khu vực hiển thị ứng dụng -->
    <main id="app-container" class="flex-grow px-4 sm:px-6 lg:px-8 pb-12"></main>

    <script>
        // --- DATA STORE (STATE MANAGEMENT) ---
        let state = {
            step: 'UPLOAD', // Các bước: UPLOAD, MAPPING, PROCESSING, DASHBOARD
            regulation: 'NEW', // OLD (200/133) hoặc NEW (99/58)
            expandedRuleId: null,
            files: { sskt: [], bctc: [], tkt: [], tmbctc: [] }
        };

        // --- MOCK DATA KẾT QUẢ ĐỐI CHIẾU ---
        const RECONCILIATION_RESULTS = [
            {
                id: 1, 
                code: 'RULE_VAT_01', 
                name: 'Đối chiếu Thuế GTGT được khấu trừ', 
                status: 'PASSED',
                msg: 'Khớp hoàn toàn. Đảm bảo chính xác Số dư Nợ TK 133 và Chỉ tiêu [43] trên Tờ khai.',
                taxImpact: 'Không có rủi ro. Số thuế GTGT còn được khấu trừ chuyển kỳ sau đã khớp đúng giữa Sổ sách và Tờ khai, không cần điều chỉnh.',
                details: { sskt: 55000000, bctc: 55000000, tkt: 55000000 }
            },
            {
                id: 2, 
                code: 'RULE_REV_01', 
                name: 'Kiểm soát chênh lệch Doanh thu', 
                status: 'WARNING',
                msg: 'Phát hiện chênh lệch: Tờ khai GTGT ghi nhận doanh thu thấp hơn Sổ sách (TK 511 + 711).',
                taxImpact: 'Rủi ro bị ấn định doanh thu tính thuế. Yêu cầu kiểm tra hóa đơn và lập Tờ khai GTGT bổ sung: Điều chỉnh TĂNG các Chỉ tiêu [26] đến [32a] trên Tờ khai tương ứng để khớp với số phát sinh Có TK 511, 711 trên Sổ cái.',
                details: { sskt: 1520000000, bctc: 1520000000, tkt: 1500000000 },
                drilldown: [
                    { invoice: 'HD-001239', date: '15/04', customer: 'Công ty CP Xây Dựng Bình Minh', amount: 12000000, issue: 'Có trên Sổ Cái, thiếu trên Phụ lục Bán ra' },
                    { invoice: 'HD-001245', date: '28/04', customer: 'Cửa hàng VLXD Số 1', amount: 8000000, issue: 'Có trên Sổ Cái, thiếu trên Phụ lục Bán ra' }
                ]
            },
            {
                id: 3, 
                code: 'RULE_CIT_02', 
                name: 'Đối chiếu Chi phí Thuế TNDN', 
                status: 'FAILED',
                msg: 'Sai lệch nghiêm trọng: Chỉ tiêu [E] (Tờ khai) không khớp với Số phát sinh TK 821.',
                taxImpact: 'Phản ánh sai Số thuế TNDN phải nộp. Yêu cầu lập Tờ khai bổ sung (Mẫu 03/TNDN): Điều chỉnh lại Chỉ tiêu [E] (Thuế TNDN phải nộp) hoặc [G] (Thuế TNDN nộp thừa) cho khớp đúng với số phát sinh Nợ TK 821 trên Sổ sách.',
                details: { sskt: 300000000, bctc: 300000000, tkt: 280000000 },
                drilldown: [
                    { invoice: 'PKT-TNDN-Q1', date: '31/03', customer: 'Nộp Thuế TNDN', amount: 20000000, issue: 'Kế toán hạch toán bổ sung nhưng chưa làm tờ khai điều chỉnh HTKK' }
                ]
            },
            {
                id: 4, 
                code: 'RULE_AI_01', 
                name: 'Bóc tách Chi phí không được trừ (B4)', 
                status: 'WARNING',
                msg: 'AI phát hiện các khoản phạt vi phạm hợp đồng trong Thuyết minh BCTC chưa được loại trừ.',
                taxImpact: 'Rủi ro truy thu Thuế TNDN do ghi nhận chi phí không hợp lệ. Cần điều chỉnh ngay: Cộng khoản chi phí vi phạm này vào Chỉ tiêu [B4] (Các khoản chi không được trừ) trên Tờ khai Quyết toán TNDN (Mẫu 03/TNDN).',
                details: { sskt: 0, bctc: 15000000, tkt: 0 },
                drilldown: [
                    { invoice: 'TMBCTC_Muc_VII', date: '31/12', customer: 'Chi phí khác', amount: 15000000, issue: 'Thuyết minh ghi "Chi phí phạt vi phạm giao thông" nhưng Chỉ tiêu B4 = 0' }
                ]
            }
        ];

        // --- TIỆN ÍCH ---
        const formatVND = (val) => val != null ? new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val) : 'N/A';
        const renderIcons = () => setTimeout(() => lucide.createIcons(), 0);

        // --- RENDER CHÍNH ---
        function renderApp() {
            const container = document.getElementById('app-container');
            if (state.step === 'UPLOAD') container.innerHTML = viewUpload();
            else if (state.step === 'MAPPING') container.innerHTML = viewMapping();
            else if (state.step === 'PROCESSING') container.innerHTML = viewProcessing();
            else if (state.step === 'DASHBOARD') container.innerHTML = viewDashboard();
            renderIcons();
        }

        // --- CÁC VIEW (GIAO DIỆN) ---

        // 1. Giao diện Tải File (Upload)
        function viewUpload() {
            return `
            <div class="max-w-5xl mx-auto mt-10 animate-fade-in">
                <!-- Toggle Chọn Chuẩn Mực Kế Toán -->
                <div class="flex justify-center mb-10">
                    <div class="bg-white p-1.5 rounded-full border border-slate-200 shadow-sm inline-flex relative overflow-hidden">
                        <button onclick="updateState('regulation', 'OLD')" class="px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 ${state.regulation === 'OLD' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}">
                            Quy định Cũ (TT 200/133)
                        </button>
                        <button onclick="updateState('regulation', 'NEW')" class="px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 flex items-center ${state.regulation === 'NEW' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}">
                            Quy định Mới (TT 99/58) <span class="ml-2 px-2 py-0.5 bg-rose-500 text-white text-[10px] font-bold rounded-full animate-pulse shadow-sm">2026</span>
                        </button>
                    </div>
                </div>

                <div class="text-center mb-10">
                    <h1 class="text-3xl font-extrabold text-slate-800 mb-3 tracking-tight">Khu Vực Tải Lên Dữ Liệu Tài Chính</h1>
                    <p class="text-slate-500 font-medium">Hỗ trợ tải lên cùng lúc nhiều tệp (Multi-file). Hệ thống sẽ tự động gom nhóm số liệu theo chuẩn <strong class="text-blue-600">${state.regulation === 'NEW' ? 'Thông tư 99/2025' : 'Thông tư 200/2014'}</strong>.</p>
                </div>

                <!-- Hidden Inputs -->
                <input type="file" id="fi-sskt" class="hidden" multiple accept=".xls,.xlsx,.csv" onchange="handleFileUpload('sskt', this)">
                <input type="file" id="fi-bctc" class="hidden" multiple accept=".xml,.pdf,.xlsx" onchange="handleFileUpload('bctc', this)">
                <input type="file" id="fi-tkt" class="hidden" multiple accept=".xml" onchange="handleFileUpload('tkt', this)">
                <input type="file" id="fi-tmbctc" class="hidden" multiple accept=".doc,.docx,.pdf,.xls,.xlsx" onchange="handleFileUpload('tmbctc', this)">

                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                        ${renderFileCard('sskt', 'Sổ Sách Kế Toán', 'Sổ cái, BCĐSPS (Excel)', 'file-spreadsheet', 'blue')}
                        ${renderFileCard('bctc', 'Báo Cáo Tài Chính', 'Bảng CĐKT, KQKD (XML/PDF)', 'bar-chart-2', 'indigo')}
                        ${renderFileCard('tkt', 'Tờ Khai Thuế', 'XML kết xuất từ HTKK', 'file-code-2', 'emerald')}
                        ${renderFileCard('tmbctc', 'Thuyết Minh BCTC', 'Hỗ trợ AI đọc Word/PDF/Excel', 'brain-circuit', 'purple')}
                    </div>
                    
                    <div class="flex flex-col items-center border-t border-slate-100 pt-8">
                        <button onclick="proceedToMapping()" class="flex items-center px-8 py-4 bg-slate-800 text-white font-semibold rounded-2xl hover:bg-slate-900 transition-all transform hover:-translate-y-1 shadow-lg shadow-slate-200 focus:ring-4 focus:ring-slate-100">
                            Tiếp tục: Bước Ghép Cột Dữ Liệu <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                        </button>
                        <p class="text-xs text-slate-400 mt-4"><i data-lucide="lock" class="w-3 h-3 inline mr-1"></i> Dữ liệu được mã hóa đầu cuối (End-to-End Encryption) và tự động xóa sau 24h.</p>
                    </div>
                </div>
            </div>`;
        }

        function renderFileCard(id, title, desc, icon, color) {
            const fileCount = state.files[id].length;
            const hasFiles = fileCount > 0;
            const baseClass = hasFiles ? `border-${color}-500 bg-${color}-50 shadow-inner` : `border-slate-300 hover:border-${color}-400 hover:bg-slate-50 hover:shadow-md`;
            const textClass = hasFiles ? `text-${color}-700` : `text-slate-700`;
            const iconClass = hasFiles ? `text-${color}-600` : `text-slate-400 group-hover:text-${color}-500`;
            const badge = id === 'tmbctc' ? '<div class="absolute top-0 right-0 bg-gradient-to-r from-purple-500 to-fuchsia-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl rounded-tr-xl uppercase shadow-sm">Tích hợp AI</div>' : '';

            return `
            <div onclick="document.getElementById('fi-${id}').click()" class="border-2 border-dashed ${baseClass} rounded-2xl p-6 flex flex-col items-center justify-center text-center transition-all duration-300 cursor-pointer group relative overflow-hidden h-44">
                ${badge}
                <div class="w-14 h-14 rounded-full bg-white shadow-sm border border-slate-100 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="${hasFiles ? 'check-square-2' : icon}" class="${iconClass} w-7 h-7"></i>
                </div>
                <h3 class="font-bold text-[15px] mb-1 ${textClass}">${title}</h3>
                <p class="text-xs font-medium ${hasFiles ? `text-${color}-600` : 'text-slate-500'}">
                    ${hasFiles ? `Đã nạp ${fileCount} tệp (Gom nhóm)` : desc}
                </p>
                ${hasFiles ? `<span class="mt-2 text-[10px] text-${color}-500 underline">Nhấn để tải lại</span>` : ''}
            </div>`;
        }

        // 2. Giao diện Cấu hình Cột (Mapping)
        function viewMapping() {
            return `
            ${viewUpload()} <!-- Nền phía sau -->
            <div class="fixed inset-0 modal-bg z-50 flex items-center justify-center animate-fade-in px-4">
                <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200">
                    <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="git-merge" class="w-6 h-6 mr-2 text-indigo-600"></i> Ghép cột thông minh (Smart Mapping)
                            </h2>
                            <p class="text-sm text-slate-500 mt-1">Xác nhận cấu trúc cột đối với file Excel Sổ sách kế toán.</p>
                        </div>
                    </div>
                    <div class="p-8">
                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-sm text-blue-800 mb-6 flex items-start">
                            <i data-lucide="info" class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5"></i>
                            <p>Hệ thống tự động nhận diện tiêu đề cột dựa trên Fuzzy Logic. Bạn có thể kiểm tra và điều chỉnh lại nếu phần mềm ERP của bạn xuất file có cấu trúc lạ.</p>
                        </div>
                        
                        <div class="space-y-4">
                            ${renderMappingRow('Cột chứa [Số hiệu Tài Khoản]', ['Cột A', 'Cột B (Mã TK)', 'Cột C'], 1)}
                            ${renderMappingRow('Cột chứa [Số Phát sinh Nợ]', ['Cột D', 'Cột E', 'Cột F (PS_NO)'], 2)}
                            ${renderMappingRow('Cột chứa [Số dư Có cuối kỳ]', ['Cột H', 'Cột I (Du_Co_CK)', 'Cột J'], 1)}
                        </div>
                    </div>
                    <div class="px-8 py-5 bg-slate-50 border-t border-slate-100 flex justify-end space-x-3">
                        <button onclick="updateState('step', 'UPLOAD')" class="px-6 py-2.5 text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 font-semibold text-sm transition-colors">Trở lại</button>
                        <button onclick="startProcessing()" class="px-6 py-2.5 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 font-semibold text-sm shadow-md flex items-center transition-all transform hover:-translate-y-0.5">
                            Xác nhận & Bắt đầu đối chiếu <i data-lucide="play-circle" class="w-5 h-5 ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function renderMappingRow(label, options, selectedIdx) {
            return `
            <div class="flex items-center justify-between p-4 border border-slate-200 rounded-xl bg-white hover:border-indigo-300 transition-colors">
                <div class="w-1/2 font-semibold text-slate-700 text-sm">${label}</div>
                <div class="w-1/2">
                    <select class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-slate-50">
                        ${options.map((opt, idx) => `<option ${idx === selectedIdx ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                </div>
            </div>`;
        }

        // 3. Giao diện Đang xử lý (Loading)
        function viewProcessing() {
            return `
            <div class="max-w-2xl mx-auto mt-32 text-center animate-fade-in flex flex-col items-center">
                <div class="relative w-28 h-28 mb-8">
                    <svg class="animate-spin w-full h-full text-indigo-100" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75 text-indigo-600" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <i data-lucide="cpu" class="w-10 h-10 text-indigo-600 animate-pulse"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Đang thực thi Động cơ Đối chiếu...</h2>
                <p class="text-slate-500 font-medium mb-8">Nạp cấu trúc pháp lý: <span class="font-bold text-indigo-600">${state.regulation === 'NEW' ? 'Thông tư 99/2025 & 58/2026' : 'Thông tư 200 & 133'}</span></p>
                
                <div class="w-full max-w-md bg-slate-200 rounded-full h-2.5 overflow-hidden relative shadow-inner">
                    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-2.5 rounded-full transition-all duration-300 animate-[loading_4s_ease-in-out_forwards]" style="width: 0%"></div>
                </div>
                <div class="mt-6 text-sm font-medium text-slate-500 space-y-1">
                    <p class="animate-pulse">Gom nhóm dữ liệu đa tệp (MapReduce)... <span class="text-emerald-500">Hoàn tất</span></p>
                    <p class="animate-pulse" style="animation-delay: 1s">Kích hoạt LLM đọc Thuyết minh BCTC...</p>
                </div>
                <style>
                    @keyframes loading {
                        0% { width: 0%; }
                        20% { width: 40%; }
                        60% { width: 75%; }
                        100% { width: 100%; }
                    }
                </style>
            </div>`;
        }

        // 4. Giao diện Kết quả (Dashboard)
        function viewDashboard() {
            const passed = RECONCILIATION_RESULTS.filter(r => r.status === 'PASSED').length;
            const warnings = RECONCILIATION_RESULTS.filter(r => r.status === 'WARNING').length;
            const failed = RECONCILIATION_RESULTS.filter(r => r.status === 'FAILED').length;
            const healthScore = Math.round((passed / RECONCILIATION_RESULTS.length) * 100);

            return `
            <div class="max-w-6xl mx-auto mt-8 animate-fade-in">
                <!-- Header Dashboard -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-200 pb-6">
                    <div>
                        <h1 class="text-3xl font-extrabold text-slate-800">Báo cáo Đối chiếu & Đánh giá Rủi ro</h1>
                        <p class="text-sm font-medium text-slate-500 mt-2">Dựa trên cơ sở pháp lý: <span class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">${state.regulation === 'NEW' ? 'TT 99/2025/TT-BTC & TT 58/2026/TT-BTC' : 'TT 200/2014 & TT 133/2016'}</span></p>
                    </div>
                    <button onclick="resetApp()" class="mt-4 md:mt-0 flex items-center px-5 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-xl hover:bg-slate-50 font-semibold shadow-sm transition-all active:scale-95">
                        <i data-lucide="refresh-ccw" class="w-4 h-4 mr-2"></i> Chạy lại kỳ mới
                    </button>
                </div>

                <!-- Thống kê -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Độ an toàn Thuế</p>
                            <h3 class="text-4xl font-black ${healthScore >= 80 ? 'text-emerald-500' : healthScore >= 50 ? 'text-amber-500' : 'text-rose-500'}">${healthScore}%</h3>
                        </div>
                        <div class="w-12 h-12 rounded-full flex items-center justify-center ${healthScore >= 80 ? 'bg-emerald-50' : 'bg-rose-50'}">
                            <i data-lucide="shield" class="w-6 h-6 ${healthScore >= 80 ? 'text-emerald-500' : 'text-rose-500'}"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Hợp lệ hoàn toàn</p>
                        <h3 class="text-3xl font-black text-emerald-600">${passed} <span class="text-sm font-medium text-slate-400">quy tắc</span></h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Cảnh báo (Chênh lệch)</p>
                        <h3 class="text-3xl font-black text-amber-500">${warnings} <span class="text-sm font-medium text-slate-400">quy tắc</span></h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Lỗi / Sai lệch Thuế</p>
                        <h3 class="text-3xl font-black text-rose-600">${failed} <span class="text-sm font-medium text-slate-400">quy tắc</span></h3>
                    </div>
                </div>

                <!-- Danh sách Rule -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="divide-y divide-slate-100">
                        ${RECONCILIATION_RESULTS.map(rule => renderRuleRow(rule)).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderRuleRow(rule) {
            const isExpanded = state.expandedRuleId === rule.id;
            
            const styles = {
                PASSED: { text: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200', icon: 'check-circle-2', label: 'HỢP LỆ' },
                WARNING: { text: 'text-amber-500', bg: 'bg-amber-50', border: 'border-amber-200', icon: 'alert-triangle', label: 'CẢNH BÁO' },
                FAILED: { text: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-200', icon: 'x-octagon', label: 'SAI LỆCH' }
            };
            const s = styles[rule.status];

            return `
            <div>
                <!-- Dòng Tóm tắt -->
                <div class="px-8 py-5 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors" onclick="updateState('expandedRuleId', ${isExpanded ? null : rule.id})">
                    <div class="flex items-center space-x-5">
                        <div class="p-2 rounded-xl ${s.bg} ${s.text}">
                            <i data-lucide="${s.icon}" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-3 mb-1">
                                <span class="text-[10px] font-mono font-bold px-2 py-0.5 bg-slate-100 text-slate-500 rounded border border-slate-200">${rule.code}</span>
                                <h3 class="font-bold text-slate-800 text-lg">${rule.name}</h3>
                            </div>
                            <p class="text-sm font-medium text-slate-500 truncate max-w-2xl">${rule.msg}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-5">
                        <span class="px-4 py-1.5 rounded-full text-xs font-black border uppercase tracking-wider ${s.bg} ${s.text} ${s.border}">${s.label}</span>
                        <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center transition-transform duration-300 ${isExpanded ? 'rotate-180 bg-slate-200' : ''}">
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500"></i>
                        </div>
                    </div>
                </div>

                <!-- Chi tiết (Mở rộng) -->
                ${isExpanded ? `
                <div class="px-8 pb-8 pt-4 bg-slate-50/50 border-t border-slate-100 border-b border-slate-200 animate-fade-in shadow-inner">
                    
                    <!-- Lưới Số liệu 3 chân -->
                    <div class="mb-6">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Số liệu trích xuất (Chưa chỉnh sửa)</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-0 border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
                            <div class="p-5 border-b md:border-b-0 md:border-r border-slate-100 text-center relative">
                                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                                <p class="text-xs font-bold text-slate-500 mb-2 uppercase">Sổ Sách Kế Toán</p>
                                <p class="text-xl font-mono font-black text-slate-800">${formatVND(rule.details.sskt)}</p>
                            </div>
                            <div class="p-5 border-b md:border-b-0 md:border-r border-slate-100 text-center relative bg-slate-50/30">
                                <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
                                <p class="text-xs font-bold text-slate-500 mb-2 uppercase">BCTC / Thuyết Minh</p>
                                <p class="text-xl font-mono font-black text-slate-800">${formatVND(rule.details.bctc)}</p>
                            </div>
                            <div class="p-5 text-center relative">
                                <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                                <p class="text-xs font-bold text-slate-500 mb-2 uppercase">Tờ Khai Thuế</p>
                                <p class="text-xl font-mono font-black text-slate-800">${formatVND(rule.details.tkt)}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Rủi ro Thuế -->
                    <div class="mb-6 bg-slate-900 text-white p-5 rounded-xl border border-slate-800 shadow-lg flex items-start">
                        <div class="p-2 bg-amber-500/20 rounded-lg mr-4 mt-0.5">
                            <i data-lucide="shield-alert" class="w-5 h-5 text-amber-400"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm text-amber-400 mb-1.5 uppercase tracking-wider">Đánh giá rủi ro & Hướng dẫn điều chỉnh</p>
                            <p class="text-sm font-medium text-slate-300 leading-relaxed">${rule.taxImpact}</p>
                        </div>
                    </div>

                    <!-- Truy vết hóa đơn (Drill-down) -->
                    ${rule.drilldown ? `
                    <div>
                        <h4 class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-3 flex items-center">
                            <i data-lucide="search-check" class="w-4 h-4 mr-1.5"></i> Phân tích truy vết nguyên nhân (Drill-down)
                        </h4>
                        <div class="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
                            <table class="min-w-full text-sm text-left">
                                <thead class="bg-slate-100/50 text-slate-600 font-bold text-xs uppercase border-b border-slate-200">
                                    <tr>
                                        <th class="px-5 py-4 w-32">Chứng từ</th>
                                        <th class="px-5 py-4 w-24">Ngày</th>
                                        <th class="px-5 py-4">Đối tượng</th>
                                        <th class="px-5 py-4 text-right w-40">Số tiền lệch</th>
                                        <th class="px-5 py-4 text-rose-600 w-64">Nguyên nhân hệ thống</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${rule.drilldown.map(d => `
                                    <tr class="hover:bg-slate-50 transition-colors group">
                                        <td class="px-5 py-4 font-bold text-indigo-600 cursor-pointer group-hover:underline">${d.invoice}</td>
                                        <td class="px-5 py-4 text-slate-500 font-medium">${d.date}</td>
                                        <td class="px-5 py-4 font-medium">${d.customer}</td>
                                        <td class="px-5 py-4 text-right font-mono font-bold text-slate-700">${formatVND(d.amount)}</td>
                                        <td class="px-5 py-4 text-rose-600 text-xs font-semibold leading-relaxed">${d.issue}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    ` : ''}

                </div>
                ` : ''}
            </div>`;
        }

        // --- HÀM XỬ LÝ (CONTROLLERS) ---
        
        function updateState(key, value) {
            state[key] = value;
            renderApp();
        }

        function handleFileUpload(id, inputElement) {
            if (inputElement.files.length > 0) {
                // Chuyển FileList thành mảng và lưu vào state
                state.files[id] = Array.from(inputElement.files);
                renderApp();
            }
        }

        function proceedToMapping() {
            // Kiểm tra xem đã upload file nào chưa
            const totalFiles = Object.values(state.files).reduce((acc, curr) => acc + curr.length, 0);
            if (totalFiles === 0) {
                alert("Vui lòng tải lên ít nhất một tài liệu tài chính (Sổ cái hoặc Tờ khai) để tiếp tục!");
                return;
            }
            updateState('step', 'MAPPING');
        }

        function startProcessing() {
            updateState('step', 'PROCESSING');
            // Giả lập Async Processing tốn thời gian 4 giây
            setTimeout(() => {
                updateState('step', 'DASHBOARD');
            }, 4000);
        }

        function resetApp() {
            state = {
                step: 'UPLOAD',
                regulation: state.regulation, // Giữ lại setting chuẩn mực
                expandedRuleId: null,
                files: { sskt: [], bctc: [], tkt: [], tmbctc: [] }
            };
            renderApp();
        }

        // Khởi chạy ứng dụng
        document.addEventListener('DOMContentLoaded', renderApp);

    </script>
</body>
</html>
